
name: Update BPI USD rate page

on:
  schedule:
    # First attempt: 9:30 AM Philippine time
    - cron: "30 9 * * 1-5"
      timezone: "Asia/Manila"

    # Second attempt: 10:00 AM Philippine time
    - cron: "0 10 * * 1-5"
      timezone: "Asia/Manila"

  workflow_dispatch:

permissions:
  contents: write

# Prevent simultaneous runs from interfering with each other.
concurrency:
  group: bpi-rate-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check whether update is already completed today
        id: check
        run: |
          TODAY=$(TZ=Asia/Manila date +%F)

          if [ -f docs/bpi_update_status.txt ]; then
            STATUS=$(cat docs/bpi_update_status.txt)

            if [ "$STATUS" = "$TODAY" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "BPI rate already updated today. Skipping."
              exit 0
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "No successful update recorded today. Proceeding."

      - name: Fetch BPI rate and rebuild page
        if: steps.check.outputs.skip != 'true'
        run: python update_rate.py

      - name: Save changes
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update BPI USD rate"
            git push
          fi
