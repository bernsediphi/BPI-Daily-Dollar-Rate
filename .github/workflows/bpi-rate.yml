
name: Update BPI USD rate page

on:
  schedule:
    # 9:30 AM PHT = 1:30 AM UTC
    - cron: "30 1 * * 1-5"

    # 10:00 AM PHT = 2:00 AM UTC
    - cron: "0 2 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bpi-rate-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check if already updated today
        id: check
        run: |
          TODAY=$(TZ=Asia/Manila date +%F)

          if [ -f docs/bpi_update_status.txt ] &&
             [ "$(cat docs/bpi_update_status.txt)" = "$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Already updated today. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch BPI rate and rebuild page
        if: steps.check.outputs.skip != 'true'
        run: python update_rate.py

      - name: Save changes
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update BPI USD rate"
            git push
          fi
