name: Update BPI USD rate page

on:
  schedule:
    # Mon-Fri at 9:30 AM and 4:45 PM Manila time (01:30 and 08:45 UTC)
    - cron: "5 2 * * 1-5"
    - cron: "5 3 * * 1-5"
  workflow_dispatch: # manual run from the Actions tab

permissions:
  contents: write # lets the job save the updated page to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Fetch BPI rate and rebuild the page
        run: python update_rate.py

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update BPI USD rate"
            git push
          fi
